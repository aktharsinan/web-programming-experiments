<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Akthar Sinan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="container nav">
    <a class="logo" href="index.html">AKTHAR<span>.</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a class="active" href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<main>
  <section class="page-title container">
    <p class="eyebrow">Get In Touch</p>
    <h1>Contact Me</h1>
    <p>Feel free to contact me about projects, learning or collaboration.</p>
  </section>

  <section class="container section contact-section">
    <form class="contact-form" action="#" method="post">
      <div class="form-row">
        <div class="form-group"><label for="name">Name</label><input id="name" name="name" type="text" required></div>
        <div class="form-group"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
      </div>
      <div class="form-group"><label for="message">Message</label><textarea id="message" name="message" rows="7" required></textarea></div>
      <button class="btn" type="submit">Send Message</button>
      <small>No backend connected — this is a demonstration form.</small>
    </form>
  </section>
</main>

<footer>
  <div class="container footer"><p>© 2026 Akthar Sinan</p><p>HTML5 &amp; CSS3</p></div>
</footer>
</body>
</html>
